name: Build

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Jobs only read the repository; the publish job alone may request an OIDC token for NuGet Trusted Publishing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned to commits so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The packages have the version of the PdfPecker release they are built on. A release must use that exact tag.
      - name: Version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's:.*<PdfPeckerVersion>\(.*\)</PdfPeckerVersion>.*:\1:p' Directory.Build.props)
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match PdfPeckerVersion $version in Directory.Build.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The fonts and pattern files (about 100 MB) are cached by the manifest that pins them; fetch checks every
      # SHA-256 either way, so a cache entry cannot change what is packed. A release downloads them afresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'release'
        with:
          path: sources
          key: sources-${{ hashFiles('sources.json') }}

      - name: Fetch fonts and patterns
        run: dotnet run --project tools/FontPack -c Release -- fetch

      - name: Check the generated face and language lists
        run: dotnet run --project tools/FontPack -c Release --no-build -- check

      # Until nuget.org has the PdfPecker version the packages need, they build against the library's main branch,
      # packed with that version into local-feed/. A release never does: it needs the published library. nuget.config
      # maps the PdfPecker package to local-feed/ alone, so the published package is downloaded there too.
      - name: PdfPecker package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p local-feed
          if curl -fsS "https://api.nuget.org/v3-flatcontainer/pdfpecker/index.json" | grep -q "\"$VERSION\""; then
            echo "PdfPecker $VERSION is on nuget.org"
            curl -fsSL --retry 4 -o "local-feed/pdfpecker.$VERSION.nupkg" \
              "https://api.nuget.org/v3-flatcontainer/pdfpecker/$VERSION/pdfpecker.$VERSION.nupkg"
          elif [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "::error::PdfPecker $VERSION is not on nuget.org yet; release these packages after it"
            exit 1
          else
            echo "::warning::PdfPecker $VERSION is not on nuget.org yet; building against the library's main branch"
            git clone --depth 1 https://github.com/Moonwalker1307/PdfPecker.git "$RUNNER_TEMP/pdfpecker"
            dotnet pack "$RUNNER_TEMP/pdfpecker/src/PdfPecker" -c Release -p:Version="$VERSION" -p:EnablePackageValidation=false -o local-feed
          fi

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg
          retention-days: 7

  # Pushes the packages to nuget.org with Trusted Publishing: NuGet/login swaps a GitHub OIDC token for a short-lived
  # API key, so no long-lived key is stored in the repository. Runs only for published releases.
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ needs.build.outputs.version }}
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check nuget.org user is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the repository variable NUGET_USER to the nuget.org account that owns the Trusted Publishing policy"
            exit 1
          fi

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
